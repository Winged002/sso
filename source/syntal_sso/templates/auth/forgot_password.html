{% extends 'base.html' %}{% block auth_content %}<section class="auth-card"><h1>Reset password</h1>{% for category,message in get_flashed_messages(with_categories=true) %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input type="email" name="email" required></label><button class="primary">Send reset link</button></form><a href="/login">Sign in</a></section>{% endblock %}
