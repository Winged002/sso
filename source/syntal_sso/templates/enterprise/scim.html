{% extends "base.html" %}{% block content %}<h1>SCIM provisioning</h1><p>Endpoint: <code>/scim/v2/{{ organization.syntal_org_id }}/Users</code></p>{% if new_token %}<div class="notice"><strong>Store this token now:</strong><pre>{{ new_token }}</pre></div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" value="Directory provisioning"></label><button>Create SCIM token</button></form>{% for t in tokens %}<div class="card"><strong>{{ t.name }}</strong> · {{ t.status }} · {{ t.scim_token_id }}</div>{% endfor %}{% endblock %}
