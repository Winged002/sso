{% extends 'base.html' %}{% block auth_content %}<section class="auth-card"><h1>Sign out of Syntal?</h1><p>This will end your Syntal session and revoke its refresh tokens.</p><form method="post">{% for key,value in values.items() %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="primary">Sign out</button><a href="/">Keep session</a></form></section>{% endblock %}
