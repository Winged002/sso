{% extends 'base.html' %}{% from '_components.html' import page_header %}{% block content %}{{ page_header('Billing','Billing profile','Legal, contact and address information are isolated from operational billing data.') }}<section class="card form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid two"><label>Legal name<input name="legal_name" value="{{ customer.legal_name or organization.legal_name or '' }}" {{ 'disabled' if not can_manage else '' }}></label><label>Billing email<input type="email" name="billing_email" value="{{ customer.billing_email or organization.billing_email or '' }}" {{ 'disabled' if not can_manage else '' }}></label><label>Currency<input name="currency" value="{{ customer.currency or 'USD' }}" {{ 'disabled' if not can_manage else '' }}></label><label>Country<input name="country" value="{{ (customer.address or {}).get('country','') }}" {{ 'disabled' if not can_manage else '' }}></label><label>Address line 1<input name="line1" value="{{ (customer.address or {}).get('line1','') }}" {{ 'disabled' if not can_manage else '' }}></label><label>Address line 2<input name="line2" value="{{ (customer.address or {}).get('line2','') }}" {{ 'disabled' if not can_manage else '' }}></label><label>City<input name="city" value="{{ (customer.address or {}).get('city','') }}" {{ 'disabled' if not can_manage else '' }}></label><label>Postal code<input name="postal_code" value="{{ (customer.address or {}).get('postal_code','') }}" {{ 'disabled' if not can_manage else '' }}></label></div>{% if can_manage %}<div class="form-actions"><button class="primary">Save billing profile</button></div>{% endif %}</form></section>{% endblock %}
