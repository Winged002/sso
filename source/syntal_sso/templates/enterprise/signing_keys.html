{% extends "base.html" %}{% block content %}<h1>Signing keys</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Rotate signing key</button></form>{% for k in keys %}<div class="card"><strong>{{ k.kid }}</strong> · {{ k.status }}<div><code>{{ k.fingerprint_sha256 }}</code></div>{% if k.status != 'active' and k.status != 'retired' %}<form method="post" action="{{ url_for('signing_keys.retire',org_id=organization.syntal_org_id,kid=k.kid) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Retire</button></form>{% endif %}</div>{% endfor %}{% endblock %}
