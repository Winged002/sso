{% extends "base.html" %}{% block content %}<h1>Service accounts</h1>{% if new_secret %}<div class="notice"><strong>Store this secret now:</strong><pre>{{ new_secret }}</pre></div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" required></label><label>Application<select name="application">{% for app in applications %}<option value="{{ app.client_id }}">{{ app.name }}</option>{% endfor %}</select></label><button>Create service account</button></form><hr>{% for a in accounts %}<div class="card"><strong>{{ a.name }}</strong><div>{{ a.client_id }} · {{ a.application }} · {{ a.status }}</div><form method="post" action="{{ url_for('service_accounts.revoke',org_id=organization.syntal_org_id,sid=a.service_account_id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Revoke</button></form></div>{% endfor %}{% endblock %}
