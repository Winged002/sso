{% extends "base.html" %}{% block content %}<h1>Signed event delivery</h1>{% if new_secret %}<div class="notice"><strong>Signing secret:</strong><pre>{{ new_secret }}</pre></div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>HTTPS endpoint<input name="url" type="url" required></label><label>Events<input name="events" value="*"></label><button>Create subscription</button></form>{% for s in subscriptions %}<div class="card"><strong>{{ s.url }}</strong> · {{ s.status }}<form method="post" action="{{ url_for('events.revoke',org_id=organization.syntal_org_id,sid=s.subscription_id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Revoke</button></form></div>{% endfor %}{% endblock %}
