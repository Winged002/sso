# Reference for a NEW deployment. Preserve your existing compose file and volumes on upgrade.
services:
  web:
    build: .
    image: syntal-sso:3.3.0
    env_file: .env
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - ./instance:/app/instance:ro
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/readyz',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
  mongo:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  mongo_data:
  redis_data:
