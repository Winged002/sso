{% extends 'base.html' %}{% from '_components.html' import page_header %}{% block content %}{{ page_header('Settings','Organization settings','Edit organization identity and regional defaults on a dedicated page.') }}<section class="card form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid two"><label>Name<input name="name" value="{{ organization.name or '' }}" {{ 'disabled' if not can_manage else '' }}></label><label>Display name<input name="display_name" value="{{ organization.display_name or '' }}" {{ 'disabled' if not can_manage else '' }}></label><label>Legal name<input name="legal_name" value="{{ organization.legal_name or '' }}" {{ 'disabled' if not can_manage else '' }}></label><label>Billing email<input type="email" name="billing_email" value="{{ organization.billing_email or '' }}" {{ 'disabled' if not can_manage else '' }}></label><label>Timezone<input name="timezone" value="{{ organization.timezone or '' }}" {{ 'disabled' if not can_manage else '' }}></label><label>Locale<input name="locale" value="{{ organization.locale or '' }}" {{ 'disabled' if not can_manage else '' }}></label></div>{% if can_manage %}<div class="form-actions"><button class="primary">Save organization</button></div>{% endif %}</form></section>{% endblock %}
