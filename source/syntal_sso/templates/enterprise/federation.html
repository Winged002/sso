{% extends "base.html" %}{% block content %}<h1>Enterprise federation</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Type<select name="type"><option value="oidc">OIDC</option><option value="saml">SAML 2.0</option></select></label><label>Name<input name="name" required></label><h3>OIDC</h3><label>Issuer<input name="issuer"></label><label>Client ID<input name="client_id"></label><label>Client secret<input name="client_secret" type="password"></label><label>Authorization endpoint<input name="authorization_endpoint"></label><label>Token endpoint<input name="token_endpoint"></label><label>JWKS URI<input name="jwks_uri"></label><h3>SAML</h3><label>IdP entity ID<input name="idp_entity_id"></label><label>SSO URL<input name="sso_url"></label><label>SP entity ID<input name="sp_entity_id"></label><label>X.509 certificate<textarea name="x509_certificate"></textarea></label><button>Create provider</button></form>{% for p in providers %}<div class="card"><strong>{{ p.name }}</strong> · {{ p.type|upper }}<div><a href="{{ url_for('federation.login',org_id=organization.syntal_org_id,pid=p.provider_id) }}">Test sign-in</a></div></div>{% endfor %}{% endblock %}
